openapi: 3.1.0
info:
  title: Платформа тактических карт — API
  version: 0.2.0
  description: |
    Единая точка входа — API-шлюз. Все запросы требуют заголовок `X-Api-Key`
    (ключ определяет организацию; данные организаций изолированы).
    Для потока событий (EventSource) ключ можно передать параметром `api_key`.

    Заголовок `X-Source-System` (необязательный) — имя внешней системы,
    сделавшей изменение; попадает в события.

    Оптимистичная блокировка: ответы с документом содержат `ETag: "<ревизия>"`;
    при изменении передайте `If-Match: "<ревизия>"` — при расхождении вернётся 409.
servers:
  - url: http://localhost:8080/api
security:
  - apiKey: []
tags:
  - name: documents
  - name: layers
  - name: render
  - name: events
  - name: registry
    description: |
      Реестр объектов (формирования, сооружения, населённые пункты, операции) и факты во времени.
      Момент — строка ISO 8601 (`1945-04-25`, `1945-04-25T06:00`), без пояса — UTC; период — [from, to).
      Моменты в ответах приводятся к каноническому виду (UTC без пояса). Подробно — docs/data-model.md.
  - name: cartography
    description: |
      Карты-подложки для закрытого контура: тайловые пирамиды XYZ на диске сервиса картографии.
      Загрузка тайлов внешнего сервиса, нарезка привязанного скана, пакеты для переноса между
      установками, граница карты (coverage). Подробно — docs/cartography.md.
paths:
  /health:
    get:
      summary: Состояние сервисов платформы
      security: []
      responses:
        '200': { description: Все сервисы доступны }
        '503': { description: Часть сервисов недоступна }
  /documents:
    get:
      tags: [documents]
      summary: Список карт организации
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DocumentMeta' } } } }
    post:
      tags: [documents]
      summary: Создать карту (документы версии 1 мигрируются автоматически)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MapDocument' } } } }
      responses:
        '201': { description: Создана, content: { application/json: { schema: { $ref: '#/components/schemas/MapDocument' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /documents/{id}:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [documents]
      summary: Получить карту
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MapDocument' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [documents]
      summary: Сохранить карту целиком
      parameters: [{ $ref: '#/components/parameters/ifMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MapDocument' } } } }
      responses:
        '200': { description: Сохранена (новая ревизия) }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [documents]
      summary: Удалить карту
      responses: { '204': { description: Удалена }, '404': { $ref: '#/components/responses/Error' } }
  /documents/{id}/revisions:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [documents]
      summary: История ревизий
      responses: { '200': { description: OK } }
  /documents/{id}/revisions/{rev}:
    parameters: [{ $ref: '#/components/parameters/id' }, { name: rev, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [documents]
      summary: Карта в состоянии на ревизию
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
  /documents/{id}/layers:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [layers]
      summary: Слои карты (снизу вверх)
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Layer' } } } } } }
    post:
      tags: [layers]
      summary: Создать слой (например, слой внешней системы с source.readOnly)
      requestBody: { content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/LayerPatch' }, { type: object, properties: { above: { type: string, description: id слоя, над которым вставить } } }] } } } }
      responses: { '201': { description: Создан } }
  /documents/{id}/layers/{layerId}:
    parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/layerId' }]
    patch:
      tags: [layers]
      summary: Изменить слой (видимость, блокировка, прозрачность, имя, назначение)
      parameters: [{ $ref: '#/components/parameters/ifMatch' }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/LayerPatch' } } } }
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [layers]
      summary: Удалить слой
      parameters: [{ name: moveTo, in: query, schema: { type: string }, description: Перенести объекты в этот слой (иначе удалить) }]
      responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Error' } }
  /documents/{id}/layers/{layerId}/features:
    parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/layerId' }]
    get:
      tags: [layers]
      summary: Объекты слоя в GeoJSON
      responses: { '200': { description: OK, content: { application/geo+json: { schema: { $ref: '#/components/schemas/FeatureCollection' } } } } }
    put:
      tags: [layers]
      summary: Заменить объекты слоя данными из GeoJSON (подача слоя внешней системой)
      description: |
        Геометрия без `properties.defops` превращается в знаки по умолчанию
        (Point с name → надпись, Point → населённый пункт, LineString → рубеж,
        Polygon → район). С `properties.defops` знак восстанавливается полностью.
      requestBody: { required: true, content: { application/geo+json: { schema: { $ref: '#/components/schemas/FeatureCollection' } } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } }
  /render/svg:
    post:
      tags: [render]
      summary: SVG по документу из тела запроса (слои — группами Inkscape)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { $ref: '#/components/schemas/MapDocument' }
                layers: { type: array, items: { type: string } }
                background: { type: [string, 'null'] }
                padding: { type: number }
                time: { type: string, description: 'Обстановка на момент времени (ISO 8601)' }
      responses: { '200': { description: SVG, content: { image/svg+xml: {} } } }
  /render/geojson:
    post:
      tags: [render]
      summary: GeoJSON по документу из тела запроса
      responses: { '200': { description: OK } }
  /render/documents/{id}.svg:
    parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/layers' }, { $ref: '#/components/parameters/at' }]
    get:
      tags: [render]
      summary: SVG сохранённой карты (по умолчанию — видимые слои)
      responses: { '200': { description: SVG, content: { image/svg+xml: {} } } }
  /render/documents/{id}.geojson:
    parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/layers' }, { $ref: '#/components/parameters/at' }]
    get:
      tags: [render]
      summary: GeoJSON сохранённой карты
      responses: { '200': { description: OK } }
  /import/geojson:
    post:
      tags: [render]
      summary: Добавить объекты из GeoJSON в документ (без сохранения)
      responses: { '200': { description: 'Обновлённый документ и id добавленных объектов: { doc, added }' } }
  /presets:
    get:
      tags: [render]
      summary: Каталог условных знаков (пресеты по типам и стилям)
      responses: { '200': { description: OK } }
  /library:
    get:
      tags: [render]
      summary: Библиотека условных знаков (стили, категории, первоисточники, элементы с описаниями, вариантами оформления и ссылками на источники)
      responses: { '200': { description: OK } }
  /events:
    get:
      tags: [events]
      summary: Поток событий изменений (Server-Sent Events)
      parameters: [{ name: documentId, in: query, schema: { type: string } }, { name: api_key, in: query, schema: { type: string } }]
      responses:
        '200':
          description: 'event: document.created | document.updated | document.deleted | layer.updated | layer.features.replaced'
          content: { text/event-stream: { schema: { $ref: '#/components/schemas/DocumentEvent' } } }
  /registry/types:
    get:
      tags: [registry]
      summary: Типы объектов (встроенные — с добавленными организацией полями — и собственные типы организации)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EntityType' } } } } }
  /registry/types/{typeId}:
    parameters: [{ name: typeId, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$' } }]
    put:
      tags: [registry]
      summary: Создать или изменить тип организации
      description: |
        Для встроенного типа (formation, structure, place, operation) можно только добавить поля:
        встроенные поля передавать не обязательно, изменить их нельзя (422); имя и описание
        встроенного типа не меняются. Набор добавленных полей заменяется переданным.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntityTypeInput' } } } }
      responses:
        '200': { description: Тип с учётом встроенных полей, content: { application/json: { schema: { $ref: '#/components/schemas/EntityType' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /registry/entities:
    get:
      tags: [registry]
      summary: Поиск объектов; с at — с состоянием на момент; с bbox и at — объекты в районе на момент
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Наименование, краткое обозначение или номер (без учёта регистра) }
        - { name: type, in: query, schema: { type: string } }
        - { name: side, in: query, schema: { type: string, enum: [own, enemy, neutral] } }
        - { $ref: '#/components/parameters/at' }
        - { name: bbox, in: query, schema: { type: string }, description: 'minLon,minLat,maxLon,maxLat (WGS84); только вместе с at — иначе 400. Отбираются объекты, чьё положение на момент at (последний действующий факт с геометрией) пересекает прямоугольник' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: Объекты по наименованию; с at у каждого есть state
          content: { application/json: { schema: { type: array, items: { allOf: [{ $ref: '#/components/schemas/Entity' }, { type: object, properties: { state: { $ref: '#/components/schemas/EntityState' } } }] } } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [registry]
      summary: Создать объект (постоянные характеристики проверяются по схеме типа)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntityInput' } } } }
      responses:
        '201': { description: Создан, content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /registry/entities/{entityId}:
    parameters: [{ $ref: '#/components/parameters/entityId' }]
    get:
      tags: [registry]
      summary: Объект; с at — и его состояние на момент
      parameters: [{ $ref: '#/components/parameters/at' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [entity], properties: { entity: { $ref: '#/components/schemas/Entity' }, state: { $ref: '#/components/schemas/EntityState' } } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [registry]
      summary: Изменить постоянные характеристики
      description: |
        attrs сливаются с текущими (null — удалить ключ); null у shortName, side, existence, source — снять значение.
        Тип объекта не меняется. Если передан updatedAt и он не совпадает с текущим — 409.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EntityPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Entity' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [registry]
      summary: Удалить объект вместе с фактами
      responses: { '204': { description: Удалён }, '404': { $ref: '#/components/responses/Error' } }
  /registry/entities/{entityId}/facts:
    parameters: [{ $ref: '#/components/parameters/entityId' }]
    get:
      tags: [registry]
      summary: Все факты объекта по времени (validFrom)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Fact' } } } } }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [registry]
      summary: Добавить факт (временные характеристики и/или положение с даты)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FactInput' } } } }
      responses:
        '201': { description: Добавлен, content: { application/json: { schema: { $ref: '#/components/schemas/Fact' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /registry/entities/{entityId}/facts/{factId}:
    parameters: [{ $ref: '#/components/parameters/entityId' }, { name: factId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [registry]
      summary: Исправить факт (переданные поля заменяются целиком, null — снять)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FactPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Fact' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [registry]
      summary: Удалить факт
      responses: { '204': { description: Удалён }, '404': { $ref: '#/components/responses/Error' } }
  /registry/entities/{entityId}/history:
    parameters: [{ $ref: '#/components/parameters/entityId' }]
    get:
      tags: [registry]
      summary: История одной характеристики
      parameters: [{ name: key, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Значения по моментам появления
          content:
            application/json:
              schema:
                type: array
                items: { type: object, properties: { t: { type: string }, to: { type: [string, 'null'] }, value: {}, factId: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /registry/states:
    post:
      tags: [registry]
      summary: Состояния многих объектов на момент (для отрисовки знаков карты); несуществующие id пропускаются
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids, at], properties: { ids: { type: array, items: { type: string, format: uuid }, maxItems: 5000 }, at: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { states: { type: array, items: { $ref: '#/components/schemas/EntityState' } } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /registry/events:
    get:
      tags: [registry, events]
      summary: Поток событий реестра (Server-Sent Events)
      parameters: [{ name: entityId, in: query, schema: { type: string } }, { name: api_key, in: query, schema: { type: string } }]
      responses:
        '200':
          description: 'event: entity.created | entity.updated | entity.deleted | fact.changed'
          content: { text/event-stream: { schema: { $ref: '#/components/schemas/RegistryEvent' } } }
  /cartography/maps:
    get:
      tags: [cartography]
      summary: Карты организации (по названию)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MapSource' } } } } }
    post:
      tags: [cartography]
      summary: Создать описание карты (тайлы — загрузкой, нарезкой или импортом)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MapInput' } } } }
      responses:
        '201': { description: Создана, content: { application/json: { schema: { $ref: '#/components/schemas/MapSource' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /cartography/maps/import-package:
    post:
      tags: [cartography]
      summary: Загрузить пакет карты (tar из другой установки) → новая карта
      description: |
        Тело — архив tar: map.json (MapSource) и tiles/{z}/{x}/{y}.{ext}. Читается потоком; ответ —
        после окончания импорта. Новая карта получает новый id и kind 'package'. При неудаче частично
        загруженная карта удаляется. Предел — MAX_PACKAGE_MB.
      requestBody: { required: true, content: { application/x-tar: { schema: { type: string, format: binary } } } }
      responses:
        '201':
          description: Загружена
          content: { application/json: { schema: { type: object, properties: { map: { $ref: '#/components/schemas/MapSource' }, job: { $ref: '#/components/schemas/MapJob' } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /cartography/maps/{mapId}:
    parameters: [{ $ref: '#/components/parameters/mapId' }]
    get:
      tags: [cartography]
      summary: Карта
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MapSource' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [cartography]
      summary: Изменить описание, границу, охват, уровни, прозрачность
      description: Смена границы сбрасывает кэш обрезанных тайлов. Поля, которые меняют только задания (kind, format, stats…), пропускаются; неизвестные — 422.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MapPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MapSource' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [cartography]
      summary: Удалить карту вместе с тайлами (задания карты отменяются, история заданий остаётся)
      responses: { '204': { description: Удалена }, '404': { $ref: '#/components/responses/Error' } }
  /cartography/maps/{mapId}/tiles/{z}/{x}/{y}.{ext}:
    parameters:
      - { $ref: '#/components/parameters/mapId' }
      - { name: z, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 22 } }
      - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
      - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
      - { name: ext, in: path, required: true, schema: { type: string, enum: [png, jpg, jpeg, webp] }, description: Не влияет на ответ — формат в Content-Type }
      - { name: v, in: query, schema: { type: string }, description: Версия карты (из TileJSON) — с ней ответ кэшируется надолго (immutable) }
      - { name: If-None-Match, in: header, schema: { type: string } }
    get:
      tags: [cartography]
      summary: Тайл карты
      description: |
        Нет тайла — 204. С границей карты: тайл снаружи — прозрачный PNG, на границе — PNG,
        обрезанный по контуру, внутри — как хранится.
      responses:
        '200':
          description: Тайл (ETag, Cache-Control)
          content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } }
        '204': { description: Тайла нет }
        '304': { description: Не изменился }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /cartography/maps/{mapId}/tilejson:
    parameters: [{ $ref: '#/components/parameters/mapId' }]
    get:
      tags: [cartography]
      summary: TileJSON 3.0
      description: Адрес тайлов — путь от корня сайта с префиксом шлюза (X-Forwarded-Prefix), например /api/cartography/maps/{id}/tiles/{z}/{x}/{y}.png?v=…
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TileJSON' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /cartography/maps/{mapId}/style:
    parameters: [{ $ref: '#/components/parameters/mapId' }]
    get:
      tags: [cartography]
      summary: Минимальный стиль MapLibre (один растровый источник и слой; без шрифтов и спрайтов — офлайн)
      responses:
        '200': { description: 'Стиль MapLibre (version 8)', content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/Error' }
  /cartography/maps/{mapId}/import/xyz:
    parameters: [{ $ref: '#/components/parameters/mapId' }]
    post:
      tags: [cartography]
      summary: Загрузить тайлы внешнего XYZ-сервиса в локальное хранилище (задание)
      description: |
        Не больше rate запросов/с (по умолчанию 4), повтор при сбоях, User-Agent def-ops-cartography/0.2.
        Уже загруженные тайлы пропускаются (продолжение прерванной загрузки), 404 источника — skipped.
        Больше MAX_TILES_PER_JOB тайлов — 422 too_many_tiles с полями tiles и limit.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/XyzDownloadRequest' } } } }
      responses:
        '202': { description: Задание поставлено, content: { application/json: { schema: { $ref: '#/components/schemas/MapJob' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/TooManyTiles' }
  /cartography/maps/{mapId}/import/raster:
    parameters: [{ $ref: '#/components/parameters/mapId' }]
    post:
      tags: [cartography]
      summary: Загрузить скан с привязкой и нарезать на тайлы (задание)
      description: |
        Тело — изображение (до MAX_UPLOAD_MB), привязка — параметр georef (URL-кодированный JSON
        RasterTileRequest: controlPoints ≥3 или corners). Ответ сразу содержит итог привязки — невязки.
      parameters:
        - { name: georef, in: query, required: true, schema: { type: string }, description: 'JSON RasterTileRequest, например {"corners":[[13.3,52.55],[13.5,52.55],[13.5,52.45],[13.3,52.45]]}' }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          image/tiff: { schema: { type: string, format: binary } }
      responses:
        '202':
          description: Задание поставлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: '#/components/schemas/MapJob' }
                  georef: { $ref: '#/components/schemas/GeorefSummary' }
                  bounds: { $ref: '#/components/schemas/BBox' }
                  minzoom: { type: integer }
                  maxzoom: { type: integer }
                  format: { type: string, enum: [png, webp] }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/TooManyTiles' }
  /cartography/maps/{mapId}/package:
    parameters: [{ $ref: '#/components/parameters/mapId' }]
    get:
      tags: [cartography]
      summary: Пакет карты (tar) для переноса в закрытый контур
      description: map.json (MapSource) первым, затем tiles/{z}/{x}/{y}.{ext} — тайлы как хранятся. Отдаётся потоком.
      responses:
        '200': { description: Архив, content: { application/x-tar: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/Error' }
  /cartography/jobs:
    get:
      tags: [cartography]
      summary: Задания организации (новые первыми)
      parameters: [{ name: mapId, in: query, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MapJob' } } } } }
  /cartography/jobs/{jobId}:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [cartography]
      summary: Задание (ход выполнения)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MapJob' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /cartography/jobs/{jobId}/cancel:
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [cartography]
      summary: Отменить задание
      responses:
        '202': { description: Отмена принята, content: { application/json: { schema: { $ref: '#/components/schemas/MapJob' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /cartography/events:
    get:
      tags: [cartography, events]
      summary: Поток событий картографии (Server-Sent Events)
      parameters: [{ name: mapId, in: query, schema: { type: string } }, { name: api_key, in: query, schema: { type: string } }]
      responses:
        '200':
          description: 'event: map.created | map.updated | map.deleted | job.progress | job.done | job.failed (и для отменённых)'
          content: { text/event-stream: { schema: { $ref: '#/components/schemas/CartographyEvent' } } }
  /cartography/scale:
    get:
      tags: [cartography]
      summary: Масштаб на широте и уровне (м/пиксель, «1:25 000», линейка)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -85.06, maximum: 85.06 } }
        - { name: zoom, in: query, required: true, schema: { type: number, minimum: 0, maximum: 24 } }
        - { name: tileSize, in: query, schema: { type: integer, enum: [256, 512], default: 512 } }
        - { name: maxPx, in: query, schema: { type: number, default: 120 }, description: Наибольшая длина линейки, px }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metersPerPixel: { type: number }
                  denominator: { type: number }
                  label: { type: string, example: '1:25 000' }
                  bar: { type: object, properties: { meters: { type: number }, px: { type: number }, label: { type: string }, ticks: { type: array, items: { type: number } } } }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-Api-Key }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' } }
    layerId: { name: layerId, in: path, required: true, schema: { type: string } }
    ifMatch: { name: If-Match, in: header, schema: { type: string }, description: 'Ожидаемая ревизия, например "3"' }
    layers: { name: layers, in: query, schema: { type: string }, description: 'Список id слоёв через запятую' }
    entityId: { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    mapId: { name: mapId, in: path, required: true, schema: { type: string, format: uuid } }
    at: { name: at, in: query, schema: { type: string }, description: 'Момент ISO 8601: 1945-04-25 или 1945-04-25T06:00 (без пояса — UTC)' }
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string } } } } }
    TooManyTiles:
      description: 'Ошибка проверки; code too_many_tiles — тайлов больше предела MAX_TILES_PER_JOB'
      content:
        application/json:
          schema: { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string }, tiles: { type: integer }, limit: { type: integer } } } } }
  schemas:
    LngLat: { type: array, items: { type: number }, minItems: 2, maxItems: 2, description: '[долгота, широта], WGS84' }
    DocumentMeta:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        layers: { type: integer }
        features: { type: integer }
    Layer:
      type: object
      required: [id, name, role, visible, locked, opacity]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [base, front, friendly, enemy, labels, custom] }
        visible: { type: boolean }
        locked: { type: boolean }
        opacity: { type: number, minimum: 0, maximum: 1 }
        source:
          type: [object, 'null']
          properties: { system: { type: string }, ref: { type: string }, readOnly: { type: boolean } }
        meta: { type: object, additionalProperties: true }
    LayerPatch:
      type: object
      properties:
        name: { type: string }
        role: { type: string }
        visible: { type: boolean }
        locked: { type: boolean }
        opacity: { type: number }
        source: { type: [object, 'null'] }
        meta: { type: object }
    Feature:
      type: object
      description: Знак карты. Поля зависят от kind; полное описание — packages/core/src/model.ts.
      required: [id, kind, layerId, style]
      properties:
        id: { type: string }
        kind: { type: string, enum: [arrow, line, area, symbol, label] }
        layerId: { type: string }
        preset: { type: string }
        name: { type: string }
        points: { type: array, items: { $ref: '#/components/schemas/LngLat' } }
        at: { $ref: '#/components/schemas/LngLat' }
        anchor: { type: [object, 'null'], properties: { featureId: { type: string }, t: { type: number } } }
        text: { type: string }
        style: { type: object }
    MapDocument:
      type: object
      required: [version, name, refZoom, origin, layers, features, overlays]
      properties:
        version: { type: integer, enum: [2] }
        id: { type: string }
        revision: { type: integer }
        name: { type: string }
        refZoom: { type: number, description: 'Опорный масштаб: размеры знаков — в пикселях на этом зуме' }
        origin: { $ref: '#/components/schemas/LngLat' }
        paper: { type: string }
        view: { type: object }
        layers: { type: array, items: { $ref: '#/components/schemas/Layer' } }
        features: { type: array, items: { $ref: '#/components/schemas/Feature' } }
        overlays: { type: array, items: { type: object } }
    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { const: FeatureCollection }
        features: { type: array, items: { type: object } }
        layers: { type: array, items: { $ref: '#/components/schemas/Layer' } }
    DocumentEvent:
      type: object
      properties:
        type: { type: string }
        tenant: { type: string }
        documentId: { type: string }
        revision: { type: integer }
        layerId: { type: string }
        source: { type: string }
        at: { type: string, format: date-time }
    TimeSpan:
      type: object
      description: Период [from, to); null — без ограничения
      properties: { from: { type: [string, 'null'] }, to: { type: [string, 'null'] } }
    Geometry:
      type: object
      description: Геометрия GeoJSON в WGS84 (Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon)
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon] }
        coordinates: { type: array }
    FieldDef:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$' }
        label: { type: string }
        type: { type: string, enum: [string, text, integer, number, boolean, date, enum, ref] }
        temporal: { type: boolean, description: Значение меняется во времени — задаётся фактами }
        required: { type: boolean }
        unit: { type: string }
        options: { type: array, items: { type: object, required: [value, label], properties: { value: { type: string }, label: { type: string } } } }
        refType: { type: string, description: Для ref — тип объекта, на который ссылается поле }
        description: { type: string }
    EntityType:
      type: object
      required: [id, name, description, fields]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/FieldDef' } }
        builtin: { type: boolean }
        elements: { type: array, items: { type: string }, description: Элементы библиотеки знаков для объектов этого типа }
    EntityTypeInput:
      type: object
      required: [fields]
      properties:
        name: { type: string, description: Обязательно для собственного типа }
        description: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/FieldDef' } }
        elements: { type: array, items: { type: string } }
    Entity:
      type: object
      required: [id, type, name, attrs]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string, description: 'Полное наименование: «150-я стрелковая Идрицкая дивизия»' }
        shortName: { type: string, description: 'Краткое обозначение: «150 сд»' }
        side: { type: string, enum: [own, enemy, neutral] }
        attrs: { type: object, additionalProperties: true, description: Постоянные характеристики (поля без temporal) }
        existence: { $ref: '#/components/schemas/TimeSpan' }
        source: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EntityInput:
      type: object
      required: [type, name]
      properties:
        type: { type: string }
        name: { type: string }
        shortName: { type: string }
        side: { type: string, enum: [own, enemy, neutral] }
        attrs: { type: object, additionalProperties: true }
        existence: { $ref: '#/components/schemas/TimeSpan' }
        source: { type: string }
    EntityPatch:
      type: object
      properties:
        name: { type: string }
        shortName: { type: [string, 'null'] }
        side: { type: [string, 'null'], enum: [own, enemy, neutral, null] }
        attrs: { type: object, additionalProperties: true, description: Сливаются с текущими; null — удалить ключ }
        existence: { oneOf: [{ $ref: '#/components/schemas/TimeSpan' }, { type: 'null' }] }
        source: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time, description: Ожидаемая отметка изменения (иначе 409) }
    Fact:
      type: object
      required: [id, entityId, validFrom, validTo, attrs]
      properties:
        id: { type: string, format: uuid }
        entityId: { type: string, format: uuid }
        validFrom: { type: string }
        validTo: { type: [string, 'null'], description: Не включительно; null — бессрочно }
        attrs: { type: object, additionalProperties: true, description: 'Временные характеристики с validFrom; null — значение снято' }
        geometry: { $ref: '#/components/schemas/Geometry' }
        source: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    FactInput:
      type: object
      required: [validFrom]
      description: Нужны attrs и/или geometry; geometry null — то же, что без геометрии (факт не меняет положение)
      properties:
        validFrom: { type: string }
        validTo: { type: [string, 'null'] }
        attrs: { type: object, additionalProperties: true }
        geometry: { oneOf: [{ $ref: '#/components/schemas/Geometry' }, { type: 'null' }] }
        source: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
    FactPatch:
      type: object
      description: Переданные поля заменяются целиком (attrs — тоже); после правки факт проверяется заново
      properties:
        validFrom: { type: string }
        validTo: { type: [string, 'null'] }
        attrs: { type: object, additionalProperties: true }
        geometry: { oneOf: [{ $ref: '#/components/schemas/Geometry' }, { type: 'null' }] }
        source: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
    EntityState:
      type: object
      required: [entityId, at, exists, attrs, geometry, from]
      properties:
        entityId: { type: string }
        at: { type: string }
        exists: { type: boolean, description: Существует ли объект на момент (по existence) }
        attrs: { type: object, additionalProperties: true, description: Постоянные и временные характеристики на момент }
        geometry: { oneOf: [{ $ref: '#/components/schemas/Geometry' }, { type: 'null' }] }
        from: { type: object, additionalProperties: { type: string }, description: Для временной характеристики — id факта, из которого взято значение }
    RegistryEvent:
      type: object
      properties:
        type: { type: string, enum: [entity.created, entity.updated, entity.deleted, fact.changed] }
        tenant: { type: string }
        entityId: { type: string }
        factId: { type: string }
        change: { type: string, enum: [created, updated, deleted] }
        source: { type: string }
        at: { type: string, format: date-time }
    BBox: { type: array, items: { type: number }, minItems: 4, maxItems: 4, description: '[запад, юг, восток, север], градусы; широта до ±85,06' }
    ControlPoint:
      type: object
      required: [px, py, lngLat]
      properties:
        px: { type: number, description: Пиксель изображения по горизонтали (0 — левый край) }
        py: { type: number, description: Пиксель по вертикали (0 — верхний край) }
        lngLat: { $ref: '#/components/schemas/LngLat' }
    GeorefSummary:
      type: object
      properties:
        kind: { type: string, enum: [affine, projective] }
        width: { type: integer }
        height: { type: integer }
        rmsMeters: { type: number, description: Средняя квадратическая невязка, м }
        residuals: { type: array, items: { type: number }, description: Невязка каждой опорной точки, м }
        nativeZoom: { type: integer, description: Уровень, на котором пиксель скана ≈ пикселю тайла }
    MapSource:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        attribution: { type: string, description: Источник (сайт, архив, издание) — показывать на карте }
        date: { type: [string, 'null'], description: Состояние местности (год издания / съёмки) }
        kind: { type: string, enum: [xyz, raster, package] }
        format: { type: string, enum: [png, jpg, webp] }
        tileSize: { type: integer, enum: [256, 512] }
        minzoom: { type: integer, minimum: 0, maximum: 22 }
        maxzoom: { type: integer, minimum: 0, maximum: 22 }
        bounds: { $ref: '#/components/schemas/BBox' }
        coverage: { type: [array, 'null'], items: { $ref: '#/components/schemas/LngLat' }, minItems: 3, description: Граница карты (кольцо); за ней тайлы прозрачны }
        opacity: { type: number, minimum: 0, maximum: 1 }
        sourceUrl: { type: [string, 'null'] }
        controlPoints: { type: [array, 'null'], items: { $ref: '#/components/schemas/ControlPoint' } }
        georef: { oneOf: [{ $ref: '#/components/schemas/GeorefSummary' }, { type: 'null' }] }
        stats: { type: object, properties: { tiles: { type: integer }, bytes: { type: integer } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MapInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        attribution: { type: string }
        date: { type: [string, 'null'] }
        kind: { type: string, enum: [xyz, raster], default: xyz }
        format: { type: string, enum: [png, jpg, webp], default: png }
        tileSize: { type: integer, enum: [256, 512], default: 256 }
        minzoom: { type: integer, default: 0 }
        maxzoom: { type: integer, default: 18 }
        bounds: { $ref: '#/components/schemas/BBox' }
        coverage: { type: [array, 'null'], items: { $ref: '#/components/schemas/LngLat' } }
        opacity: { type: number, default: 1 }
    MapPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        attribution: { type: string }
        date: { type: [string, 'null'] }
        coverage: { type: [array, 'null'], items: { $ref: '#/components/schemas/LngLat' }, description: null — снять границу }
        opacity: { type: number }
        bounds: { $ref: '#/components/schemas/BBox' }
        minzoom: { type: integer }
        maxzoom: { type: integer }
    XyzDownloadRequest:
      type: object
      required: [url, bounds, minzoom, maxzoom]
      properties:
        url: { type: string, description: 'Шаблон: {z} {x} {y} {-y} {s} {quadkey}; только http(s)', example: 'https://tiles.example.org/{z}/{x}/{y}.png' }
        bounds: { $ref: '#/components/schemas/BBox' }
        minzoom: { type: integer, minimum: 0, maximum: 22 }
        maxzoom: { type: integer, minimum: 0, maximum: 22 }
        subdomains: { type: array, items: { type: string } }
        headers: { type: object, additionalProperties: { type: string }, description: 'Только Referer, Accept, Accept-Language, Origin' }
        rate: { type: number, exclusiveMinimum: 0, maximum: 20, default: 4, description: Запросов в секунду }
    RasterTileRequest:
      type: object
      properties:
        controlPoints: { type: array, items: { $ref: '#/components/schemas/ControlPoint' }, minItems: 3 }
        corners: { type: array, items: { $ref: '#/components/schemas/LngLat' }, minItems: 4, maxItems: 4, description: 'Левый верхний, правый верхний, правый нижний, левый нижний' }
        kind: { type: string, enum: [affine, projective], description: 'По умолчанию projective при ≥4 точках' }
        minzoom: { type: integer }
        maxzoom: { type: integer, description: По умолчанию — nativeZoom }
    MapJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        mapId: { type: string, format: uuid }
        type: { type: string, enum: [xyz-download, raster-tile, package-import] }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        done: { type: integer, description: Обработано тайлов (включая пропущенные и ошибки) }
        total: { type: integer }
        skipped: { type: integer, description: Уже были на диске / нет на источнике / пустые }
        errors: { type: integer }
        message: { type: string }
        result: { type: object, properties: { georef: { $ref: '#/components/schemas/GeorefSummary' } }, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TileJSON:
      type: object
      properties:
        tilejson: { type: string, enum: ['3.0.0'] }
        name: { type: string }
        description: { type: string }
        attribution: { type: string }
        scheme: { type: string, enum: [xyz] }
        tiles: { type: array, items: { type: string } }
        minzoom: { type: integer }
        maxzoom: { type: integer }
        bounds: { $ref: '#/components/schemas/BBox' }
