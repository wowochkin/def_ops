# Платформа целиком: docker compose up --build → http://localhost:8080
# Наружу открыт только шлюз; сервисы общаются во внутренней сети.
x-build: &build
  context: .
  dockerfile: deploy/Dockerfile
  # прокси для npm при сборке (берутся из окружения, если заданы)
  args: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]

x-db-url: &db-url postgres://defops:${DB_PASSWORD:-defops}@db:5432/defops

services:
  # PostgreSQL + PostGIS: у каждого сервиса своя схема (documents, registry, cartography)
  db:
    image: postgis/postgis:16-3.4-alpine
    environment: { POSTGRES_DB: defops, POSTGRES_USER: defops, POSTGRES_PASSWORD: "${DB_PASSWORD:-defops}" }
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "defops", "-d", "defops"], interval: 5s, timeout: 3s, retries: 20 }

  documents:
    image: defops/documents:${DEFOPS_TAG:-latest}
    build: *build
    environment: { SERVICE: documents, PORT: "8101", STORAGE: postgres, DATABASE_URL: *db-url }
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8101/ready"], interval: 10s, timeout: 3s, retries: 5 }

  render:
    image: defops/render:${DEFOPS_TAG:-latest}
    build: *build
    environment: { SERVICE: render, PORT: "8102", DOCUMENTS_URL: http://documents:8101 }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8102/ready"], interval: 10s, timeout: 3s, retries: 5 }

  registry:
    image: defops/registry:${DEFOPS_TAG:-latest}
    build: *build
    environment: { SERVICE: registry, PORT: "8103", STORAGE: postgres, DATABASE_URL: *db-url }
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8103/ready"], interval: 10s, timeout: 3s, retries: 5 }

  # картография: описания карт — в PostgreSQL, тайлы — в томе tiles-data
  cartography:
    image: defops/cartography:${DEFOPS_TAG:-latest}
    build: *build
    environment:
      SERVICE: cartography
      PORT: "8104"
      STORAGE: postgres
      DATABASE_URL: *db-url
      TILES_DIR: /data/tiles
      MAX_TILES_PER_JOB: ${MAX_TILES_PER_JOB:-50000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      # пусто — загрузка XYZ с любого адреса; иначе список разрешённых хостов через запятую
      XYZ_ALLOWED_HOSTS: ${XYZ_ALLOWED_HOSTS:-}
    volumes: [tiles-data:/data/tiles]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8104/ready"], interval: 10s, timeout: 3s, retries: 5 }

  gateway:
    image: defops/gateway:${DEFOPS_TAG:-latest}
    build: *build
    environment:
      SERVICE: gateway
      PORT: "8080"
      DOCUMENTS_URL: http://documents:8101
      RENDER_URL: http://render:8102
      REGISTRY_URL: http://registry:8103
      CARTOGRAPHY_URL: http://cartography:8104
      STATIC_DIR: /app/apps/editor/dist
      # AUTH=keys — обязательные API-ключи; формат API_KEYS: "ключ:организация,ключ2:организация2"
      AUTH: ${AUTH:-open}
      API_KEYS: ${API_KEYS:-}
    ports: ["${PORT:-8080}:8080"]
    depends_on:
      documents: { condition: service_healthy }
      render: { condition: service_healthy }
      registry: { condition: service_healthy }
      cartography: { condition: service_healthy }

volumes:
  db-data:
  tiles-data:
