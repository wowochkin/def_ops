server {
    listen 8443 ssl;
    server_name kshvi.local;
    ssl_certificate /run/secrets/kshvi_tls_cert;
    ssl_certificate_key /run/secrets/kshvi_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;

    location /health {
        proxy_pass http://127.0.0.1:8105/health;
        proxy_set_header Host $host;
    }
    location /ready {
        proxy_pass http://127.0.0.1:8105/ready;
        proxy_set_header Host $host;
    }
    location /api/kshvi/ {
        proxy_pass http://127.0.0.1:8105;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
