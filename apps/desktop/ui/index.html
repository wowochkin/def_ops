<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Тактическая карта</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f3ea; color: #1d1f24; }
    @media (prefers-color-scheme: dark) { body { background: #1d1f24; color: #e9e6dc; } }
    .box { text-align: center; }
    .spin { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid #b3261e33; border-top-color: #b3261e; border-radius: 50%; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .muted { opacity: 0.6; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>Запуск сервисов…</div>
    <div class="muted">документы, реестр, картография, шлюз — на этой машине</div>
  </div>
</body>
</html>
