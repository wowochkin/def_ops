[package]
name = "defops-desktop"
version = "0.1.0"
edition = "2021"
description = "Настольное приложение платформы: редактор, сервисы и агентная модель в одном окне (Tauri)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
