[package]
name = "agents-core"
version = "0.1.0"
edition = "2021"
description = "Ядро агентной модели переигровки: дивизии, штабы, объекты; часовой шаг, параллельный и воспроизводимый расчёт"
publish = false

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "agents-bench"
path = "src/bin/agents-bench.rs"

[[bin]]
name = "agents-run"
path = "src/bin/agents-run.rs"
